services:
  postgres:
    image: postgres:17-alpine
    container_name: dwange-postgres
    environment:
      POSTGRES_USER: dwange
      POSTGRES_PASSWORD: dwange_dev
      POSTGRES_DB: dwange
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwange"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dwange

volumes:
  postgres_data:

networks:
  dwange:
    driver: bridge
